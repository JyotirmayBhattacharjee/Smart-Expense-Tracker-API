<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>💰 Smart Expense Tracker</h1>

    <div class="card">

        <h2>Add Expense</h2>

        <form id="expenseForm">

            <input
                    type="text"
                    id="title"
                    placeholder="Expense Title"
                    required>

            <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    required>

            <select id="category">

                <option>Food</option>
                <option>Travel</option>
                <option>Shopping</option>
                <option>Bills</option>
                <option>Entertainment</option>
                <option>Other</option>

            </select>

            <input
                    type="date"
                    id="date"
                    required>

            <button type="submit">
                Add Expense
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Filter</h2>

        <select id="filterCategory">

            <option value="">All Categories</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>

        </select>

    </div>

    <div class="card">

        <h2>Expenses</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Delete</th>

            </tr>

            </thead>

            <tbody id="expenseTable">

            </tbody>

        </table>

    </div>

    <div class="card totalCard">

        <h2>Total Expense</h2>

        <h1 id="totalAmount">₹0</h1>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
